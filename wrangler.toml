name = "ink-bowl-thermometer"
main = "src/index.js"
compatibility_date = "2026-04-26"
compatibility_flags = ["nodejs_compat"]

# Pin deploys to one Cloudflare account so the wrong environment fails loudly
# instead of landing somewhere else. This is the account whose workers.dev
# subdomain is dailycal-keepsakes.
account_id = "3698908aee438e9c20994f722c7e6098"
workers_dev = false   # served only at the custom domain below

[vars]
# ===== THE SEASON SWITCH =====
# SEASON picks which campaigns the board reads and the label ("Ink Bowl <SEASON>"). LIVE ON 2026 since 2026-11-16:
# the Daily Cal's campaign is live; STANFORD_SLUG_2026 is blank until the Stanford Daily's link is shared, so Stanford
# shows $0 ("campaign opening soon"). A campaign that is not public yet counts as $0 and is polled until it publishes.
# TO ADD STANFORD: paste its slug into STANFORD_SLUG_2026 and push. See docs/STATUS.md.
SEASON = "2026"
GAME_DATE = "2026-11-21"           # Big Game 2026 (Cal Memorial Stadium); drives the countdown and the date shown

CAL_SLUG_2025 = "HbHXTN"           # https://givebutter.com/HbHXTN  (Daily Cal, "Ink Bowl 2025")
STANFORD_SLUG_2025 = "msB1YJ"      # https://givebutter.com/msB1YJ  (Stanford Daily, "Big Game 2025")

CAL_SLUG_2026 = "inkbowl-2026-hgksv5"   # https://givebutter.com/inkbowl-2026-hgksv5  (Daily Cal, "Ink Bowl Competitive Fund Drive 2026"; live)
STANFORD_SLUG_2026 = ""                 # <- paste the Stanford Daily's 2026 slug here when it is shared
# Optional one-off overrides (normally unset): EVENT_LABEL, CAL_SLUG, STANFORD_SLUG.
# Server-side PNG at /thermometer.png. Leave "false" on the Workers Free plan
# (the raster needs ~300ms CPU; Free allows 10ms). Staff get PNGs from /png
# regardless, rendered in their own browser.
SERVER_PNG = "false"
# Optional: numeric campaign ids make the API path a single direct GET.
# CAL_CAMPAIGN_ID = ""
# STANFORD_CAMPAIGN_ID = ""

# Secrets (never in this file; set with `wrangler secret put NAME`):
#   CAL_API_KEY        Givebutter API key from the Daily Cal's account  -> turns on API reads for Cal
#   STANFORD_API_KEY   Givebutter API key from The Stanford Daily's account -> same for Stanford
#   ADMIN_TOKEN        enables /admin/pin and /admin/unpin

[triggers]
crons = ["*/5 * * * *"]   # keep last-good totals warm

# KV namespace: shares last-good values and manual pins across the whole edge and
# survives deploys. The deploy workflow finds-or-creates the namespace titled
# "ink-bowl-thermometer-THERMO" and substitutes its id for PASTE_ID before deploying.
[[kv_namespaces]]
binding = "THERMO"
id = "PASTE_ID"

# Public hostname (the inkbowl.giving zone, same Cloudflare account). Cloudflare creates the DNS record and cert.
[[routes]]
pattern = "inkbowl.giving"
custom_domain = true

# www redirects to the bare domain (see canonicalRedirect in src/index.js).
[[routes]]
pattern = "www.inkbowl.giving"
custom_domain = true

[observability]
enabled = true
