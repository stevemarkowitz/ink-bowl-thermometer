name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Find or create the KV namespace
        run: |
          set -euo pipefail
          TITLE="ink-bowl-thermometer-THERMO"
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/storage/kv/namespaces"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ID=$(curl -fsS -H "$AUTH" "${API}?per_page=100" | jq -r --arg t "$TITLE" '.result[] | select(.title==$t) | .id' | head -1)
          if [ -z "$ID" ]; then
            ID=$(curl -fsS -X POST -H "$AUTH" -H 'Content-Type: application/json' -d "{\"title\":\"${TITLE}\"}" "$API" | jq -r '.result.id')
            echo "created KV namespace"
          else
            echo "reusing existing KV namespace"
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "no KV namespace id"; exit 1; }
          sed -i "s/PASTE_ID/${ID}/" wrangler.toml

      - name: Deploy Worker
        run: npx wrangler deploy

      - name: Set ADMIN_TOKEN (only if the repo secret exists)
        if: env.ADMIN_TOKEN != ''
        run: printf '%s' "$ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN

      - name: Smoke test
        run: |
          set -euo pipefail
          HOST=inkbowl.giving
          for i in 1 2 3 4 5 6 7 8; do
            curl -fsS --max-time 20 "https://${HOST}/api/totals.json" -o totals.json && break
            echo "not ready (attempt ${i}); waiting"; sleep 10
          done
          jq '{headline, leader, store, stale, sides: (.sides | map_values({raised, goal, source, ok}))}' totals.json
          jq -e '.sides.cal.ok and .sides.stanford.ok and .store == "kv"' totals.json
          # The image and page routes are the CPU-heavy ones (Workers Free allows 10ms): request them for real.
          curl -fsS --max-time 20 "https://${HOST}/thermometer.svg?nocache=1" -o board.svg
          head -c 4 board.svg | grep -q '<svg'; test "$(wc -c < board.svg)" -gt 50000
          curl -fsS --max-time 20 "https://${HOST}/" | grep -q 'Give to The Daily Californian'
          curl -fsS --max-time 20 "https://${HOST}/png" | grep -q 'Download PNG'
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://${HOST}/thermometer.png")" = 404   # server PNG is off by design
          echo "smoke OK: json, svg, page, png page, server-png gate"
